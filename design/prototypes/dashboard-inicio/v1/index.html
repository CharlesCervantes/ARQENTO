<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototipo Inicio Arqento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== Tokens ===== */
:root {
  --bg: #F5F6F8; --surface: #FFFFFF; --fg: #14161B; --muted: #5D6471;
  --border: #E2E5EA; --subtle: #EEF0F3; --series-2: #7A8290;
  --ok: #059669; --ok-ink: #047857; --ok-soft: #ECFDF5;
  --warn: #D97706; --warn-ink: #B45309; --warn-soft: #FFFBEB;
  --bad: #DC2626; --bad-ink: #B91C1C; --bad-soft: #FEF2F2;
  --shadow: 0 1px 2px rgba(16,24,40,.04), 0 12px 32px -16px rgba(16,24,40,.18);
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1014; --surface: #161920; --fg: #ECEEF2; --muted: #9AA2AF;
    --border: #272C35; --subtle: #1E222A; --series-2: #6E7686;
    --ok-ink: #34D399; --ok-soft: #0F2A22; --warn-ink: #FBBF24; --warn-soft: #2D2310;
    --bad-ink: #F87171; --bad-soft: #2E1416;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1014; --surface: #161920; --fg: #ECEEF2; --muted: #9AA2AF;
  --border: #272C35; --subtle: #1E222A; --series-2: #6E7686;
  --ok-ink: #34D399; --ok-soft: #0F2A22; --warn-ink: #FBBF24; --warn-soft: #2D2310;
  --bad-ink: #F87171; --bad-soft: #2E1416;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 32px -16px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* Derivados de marca: declarados donde se inyecta --brand (equivale a la raíz del AppShell) */
.app {
  --brand-ink: color-mix(in oklch, var(--brand) 72%, black);
  --brand-chart: color-mix(in oklch, var(--brand) 88%, black);
  --brand-soft: color-mix(in oklch, var(--brand) 10%, var(--surface));
  --brand-track: color-mix(in oklch, var(--brand) 18%, var(--surface));
  --brand-fg: #fff;
}
@supports (color: oklch(from red l c h)) {
  .app {
    --brand-ink: oklch(from var(--brand) min(l, 0.5) c h);
    --brand-chart: oklch(from var(--brand) min(l, 0.62) c h);
    --brand-fg: oklch(from var(--brand) clamp(0, (0.68 - l) * 999, 1) 0 0);
  }
  :root[data-theme="dark"] .app {
    --brand-ink: oklch(from var(--brand) max(l, 0.75) c h);
    --brand-chart: oklch(from var(--brand) clamp(0.6, l, 0.74) c h);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .app {
      --brand-ink: oklch(from var(--brand) max(l, 0.75) c h);
      --brand-chart: oklch(from var(--brand) clamp(0.6, l, 0.74) c h);
    }
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 14px/20px "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--brand-ink, var(--fg)); outline-offset: 2px; }
.skip { position: absolute; left: 8px; top: -40px; background: var(--surface); padding: 8px 12px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 8px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ===== Controles del prototipo ===== */
.proto {
  position: sticky; top: 0; z-index: 40;
  background: repeating-linear-gradient(135deg, var(--subtle) 0 8px, var(--bg) 8px 16px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px; display: flex; gap: 16px; align-items: center;
  overflow-x: auto; white-space: nowrap; font-size: 13px;
}
.proto :focus-visible { outline-color: var(--fg); }
.proto-title { font-weight: 600; }
.proto-group { display: flex; align-items: center; gap: 6px; }
.proto-group > span { color: var(--muted); }
.proto select, .proto .pbtn {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 4px 8px; font-size: 13px; cursor: pointer;
}
.proto .pbtn[aria-pressed="true"] { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.proto .pbtn:disabled { opacity: .45; cursor: not-allowed; }
.swatch { width: 22px; height: 22px; border-radius: 999px; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--border); cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.proto input[type=color] { width: 26px; height: 24px; border: 1px solid var(--border); border-radius: 6px; padding: 0; background: none; cursor: pointer; }

/* ===== Shell ===== */
.app > div { min-width: 0; }
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: calc(100vh - 45px); }
.side {
  position: sticky; top: 45px; height: calc(100vh - 45px);
  background: var(--surface); border-right: 1px solid var(--border);
  padding: 20px 12px; display: flex; flex-direction: column; gap: 24px;
}
.org { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
.logo {
  width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center;
  background: var(--brand); color: var(--brand-fg); font-weight: 600; font-size: 13px;
  transition: background-color 200ms var(--ease-out), color 200ms;
}
.org b { display: block; font-weight: 600; }
.org small { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; color: var(--muted); }
.nav a:hover { background: var(--subtle); color: var(--fg); }
.nav a[aria-current="page"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 500; }
.me { margin-top: auto; display: flex; gap: 10px; align-items: center; padding: 8px; border-top: 1px solid var(--border); padding-top: 16px; }
.avatar {
  width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center;
  background: var(--brand); color: var(--brand-fg); font-size: 12px; font-weight: 600;
  transition: background-color 200ms var(--ease-out);
}
.me small { display: block; color: var(--muted); font-size: 12px; }
.topbar { display: none; }
.scrim { display: none; }

main { padding: 32px 40px 64px; min-width: 0; }
.wrap { max-width: 1440px; margin: 0 auto; }

/* ===== Encabezado ===== */
.head { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end; justify-content: space-between; margin-bottom: 24px; }
.head h1 { font-size: 28px; line-height: 34px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
.head p { margin: 0; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; background: var(--subtle); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  color: var(--muted); font-size: 13px; display: inline-flex; gap: 6px; align-items: center;
  transition: background-color 150ms var(--ease-out), color 150ms;
}
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); font-weight: 500; box-shadow: 0 1px 2px rgba(16,24,40,.08); }
.seg button.priv[aria-pressed="true"] { background: var(--fg); color: var(--surface); }

.privbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  background: var(--fg); color: var(--surface); border-radius: 10px;
  padding: 10px 14px; margin: -8px 0 24px;
}
.privbar button { margin-left: auto; background: transparent; border: 1px solid color-mix(in srgb, var(--surface) 40%, transparent); color: inherit; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.privbar button:focus-visible { outline-color: var(--surface); }
.tag-priv {
  align-self: flex-start; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500;
  padding: 1px 8px; border-radius: 999px; background: var(--fg); color: var(--surface); line-height: 18px;
}
.tag-priv svg.i { width: 12px; height: 12px; }

/* ===== Grid del dashboard ===== */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 32px 24px; }
.grid > * { grid-column: span 12; min-width: 0; }
.a-rail { order: 1; } .a-kpi { order: 2; } .a-rent { order: 3; } .a-flujo { order: 4; } .a-avance { order: 5; }
.a-obras { order: 6; } .a-aten { order: 7; } .a-comp { order: 8; } .a-fiscal { order: 9; }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
.panel-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.panel-h h2, .sec-h h2 { font-size: 17px; line-height: 24px; font-weight: 600; margin: 0; }
.panel-h p, .sec-h p { margin: 2px 0 0; color: var(--muted); font-size: 13px; line-height: 18px; }
.linkbtn { background: none; border: 0; padding: 4px 6px; margin: -4px -6px; border-radius: 6px; cursor: pointer; color: var(--brand-ink); font-size: 13px; font-weight: 500; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* ===== Riel de la semana (elemento distintivo) ===== */
.rail { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 20px 0 22px; }
.rail-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.rail-top h2 { font-size: 17px; font-weight: 600; margin: 0; }
.rail-top small { color: var(--muted); font-size: 12px; }
.days { display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.days span { text-align: center; }
.days span.wk { opacity: .55; }
.days span.today { color: var(--fg); font-weight: 600; }
.track { position: relative; height: 6px; display: flex; gap: 2px; margin-bottom: 18px; }
.seg-line { height: 6px; border-radius: 3px; transition: background 200ms var(--ease-out); }
.today-dot {
  position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 999px;
  background: var(--brand-chart); border: 3px solid var(--bg); transform: translate(-50%, -50%);
  box-sizing: content-box;
}
.stages { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 2px; }
.stage { padding: 12px 14px; border-radius: 10px; }
.stage.now { background: var(--brand-soft); }
.stage h3 { margin: 0 0 6px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.stage h3 small { font-weight: 500; font-size: 12px; color: var(--brand-ink); }
.stage ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.stage li a { display: inline-flex; gap: 6px; align-items: baseline; border-radius: 4px; }
.stage li a:hover { text-decoration: underline; text-underline-offset: 3px; }
.stage li b { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); }
.chip.ok svg { color: var(--ok); }
.chip.pend { border-style: dashed; color: var(--warn-ink); }
.btn-brand {
  display: inline-flex; gap: 6px; align-items: center; margin-top: 10px;
  background: var(--brand); color: var(--brand-fg); border: 0; border-radius: 8px;
  padding: 7px 12px; font-weight: 500; cursor: pointer; transition: background-color 200ms var(--ease-out);
}
.rail-m { display: none; }

/* ===== Banda KPI (único nivel con sombra) ===== */
.kpis { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi { padding: 20px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; min-width: 0; border-radius: 0; }
.kpi:first-child { border-left: 0; border-radius: 16px 0 0 16px; }
.kpi:last-child { border-radius: 0 16px 16px 0; }
a.kpi:hover { background: color-mix(in srgb, var(--subtle) 60%, var(--surface)); }
.kpi-label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
.kpi-value { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.kpi-value.pos { color: var(--ok-ink); } .kpi-value.neg { color: var(--bad-ink); }
.kpi-value .unit { font-size: 15px; font-weight: 500; color: var(--muted); }
.kpi-sub { font-size: 13px; color: var(--muted); line-height: 18px; }
.kpi-sub b { color: var(--fg); font-weight: 500; }
.kpi-sub.mini { font-size: 12px; }
.badge {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500;
  padding: 2px 8px; border-radius: 999px; line-height: 18px;
}
.badge svg.i { width: 13px; height: 13px; }
.b-warn { background: var(--warn-soft); color: var(--warn-ink); }
.b-bad { background: var(--bad-soft); color: var(--bad-ink); }
.b-ok { background: var(--ok-soft); color: var(--ok-ink); }
.b-neutral { background: var(--subtle); color: var(--muted); }
.gauge { height: 8px; border-radius: 4px; background: var(--brand-track); overflow: hidden; margin: 6px 0 2px; }
.gauge > i { display: block; height: 100%; background: var(--brand-chart); border-radius: 4px; transform-origin: left; transition: background-color 200ms var(--ease-out); }
.delta { font-size: 13px; color: var(--ok-ink); display: inline-flex; gap: 4px; align-items: center; }

/* ===== Rentabilidad (Privado) ===== */
.rent { display: grid; grid-template-columns: auto auto minmax(220px, 1fr); gap: 16px 40px; align-items: center; padding: 18px 20px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); }
.rent-h { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
.rent-h h2 { font-size: 15px; font-weight: 600; margin: 0; }
.rent-v small { display: block; color: var(--muted); font-size: 13px; }
.rent-v b { font-size: 22px; line-height: 28px; font-weight: 600; }
.rent-v span { color: var(--muted); font-size: 13px; }
.pair { display: grid; gap: 6px; }
.pair-row { display: grid; grid-template-columns: 96px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.pair-row .bar { height: 10px; background: var(--subtle); border-radius: 3px; position: relative; }
.pair-row .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 0 3px 3px 0; transform-origin: left; }
.pair-row b { color: var(--fg); font-weight: 500; text-align: right; }

/* ===== Gráficas ===== */
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw.line { height: 2px; width: 14px; border-radius: 1px; background: var(--fg); }
.chart { position: relative; }
.chart svg { display: block; overflow: visible; }
.chart svg:focus-visible { outline-offset: 4px; border-radius: 6px; }
.chart text { fill: var(--muted); font-size: 12px; font-family: inherit; }
.chart .grid-l { stroke: var(--border); stroke-width: 1; }
.chart .zero { stroke: var(--muted); stroke-width: 1; }
.chart .xhair { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.bars-grow rect.b, .bars-grow path.b { transform-box: fill-box; transform-origin: bottom; animation: growY 500ms var(--ease-out) both; }
@keyframes growY { from { transform: scaleY(0); } }
@keyframes growX { from { transform: scaleX(0); } }
.grow-x { animation: growX 500ms var(--ease-out) both; transform-origin: left; }

.bullets { display: grid; gap: 4px; }
.brow { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 44px 64px; gap: 12px; align-items: center; padding: 8px 6px; border-radius: 8px; cursor: default; }
.brow:hover, .brow:focus-visible { background: var(--subtle); }
.brow .nm { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btrack { position: relative; height: 10px; background: var(--subtle); border-radius: 3px; }
.btrack .f { position: absolute; inset: 0 auto 0 0; background: var(--brand-chart); border-radius: 0 3px 3px 0; transition: background-color 200ms var(--ease-out); }
.btrack .m { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--fg); border-radius: 1px; box-shadow: 0 0 0 2px var(--surface); transform: translateX(-1px); }
.brow .pct { text-align: right; font-weight: 500; }
.brow .gap { text-align: right; font-size: 13px; color: var(--muted); display: inline-flex; gap: 3px; justify-content: flex-end; align-items: center; }
.brow .gap.warn { color: var(--warn-ink); font-weight: 500; }
.brow .inc { font-size: 12px; color: var(--muted); grid-column: 2 / -1; }
.axis-x { display: grid; grid-template-columns: minmax(96px, 150px) 1fr 44px 64px; gap: 12px; padding: 0 6px; font-size: 12px; color: var(--muted); }
.axis-x div { display: flex; justify-content: space-between; }

.dtable { width: 100%; border-collapse: collapse; font-size: 13px; }
.dtable th { text-align: left; font-weight: 500; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--border); }
.dtable td { padding: 8px; border-bottom: 1px solid var(--border); }
.dtable .r { text-align: right; }

.tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--fg);
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  padding: 10px 12px; font-size: 13px; min-width: 200px; opacity: 0; transform: translateY(4px);
  transition: opacity 150ms var(--ease-out), transform 150ms var(--ease-out);
}
.tip.on { opacity: 1; transform: none; }
.tip h4 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.tip .tr { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.tip .tr span { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
.tip .tr b { font-weight: 500; font-variant-numeric: tabular-nums; }

/* ===== Obras ===== */
.otable { width: 100%; border-collapse: collapse; }
.otable th { text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); padding: 0 10px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.otable td { padding: 14px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
.otable tr:last-child td { border-bottom: 0; }
.otable tbody tr { cursor: pointer; transition: background-color 150ms; }
.otable tbody tr:hover, .otable tbody tr:focus-within { background: var(--brand-soft); }
.otable .r { text-align: right; }
.oname { display: flex; gap: 10px; align-items: flex-start; min-width: 190px; }
.thumb { width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink); font-size: 12px; font-weight: 600; }
.oname a { font-weight: 500; }
.oname a::after { content: ""; position: absolute; inset: 0; }
.otable tr { position: relative; }
.oname small { display: block; color: var(--muted); font-size: 12px; }
.mg { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.otable td:nth-last-child(2) { min-width: 170px; }
.otable .badge { white-space: nowrap; }
.mg .gauge { width: 56px; margin: 0; height: 6px; }
.amt { font-weight: 500; }
.amt-sub { display: block; color: var(--muted); font-size: 12px; }
.razon { display: block; font-size: 13px; color: var(--muted); margin-top: 4px; }
.chev { color: var(--muted); }
.ocards { display: none; }
.foot-note { margin-top: 12px; font-size: 13px; color: var(--muted); }

/* ===== Atención ===== */
.agroup + .agroup { margin-top: 16px; }
.agroup h3 { font-size: 13px; font-weight: 600; margin: 0 0 8px; display: flex; gap: 6px; align-items: center; }
.agroup h3.bad { color: var(--bad-ink); } .agroup h3.warn { color: var(--warn-ink); }
.alert {
  display: grid; grid-template-columns: 3px 20px 1fr; gap: 10px; padding: 10px 10px 10px 0; border-radius: 8px;
  align-items: start;
}
a.alert:hover { background: var(--subtle); }
.alert .stripe { align-self: stretch; border-radius: 3px; }
.alert .ic { padding-top: 1px; }
.alert b { font-weight: 500; display: block; }
.alert small { color: var(--muted); font-size: 13px; }
.alert.bad .stripe { background: var(--bad); } .alert.bad .ic { color: var(--bad-ink); }
.alert.warn .stripe { background: var(--warn); } .alert.warn .ic { color: var(--warn-ink); }

/* ===== Compromisos ===== */
.clist { list-style: none; margin: 0; padding: 0; }
.clist li { display: grid; grid-template-columns: 32px 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.clist li:last-child { border-bottom: 0; }
.cic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-ink); }
.clist b { font-weight: 500; display: block; }
.clist small { color: var(--muted); font-size: 13px; }

/* ===== Fiscal (nivel C, sin contenedor) ===== */
.fiscal { border-top: 1px solid var(--border); padding-top: 20px; }
.sec-h { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; align-items: flex-start; }
.fvals { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.fvals small { display: block; color: var(--muted); font-size: 13px; }
.fvals b { font-size: 20px; line-height: 28px; font-weight: 600; }
.fbars { display: grid; gap: 6px; }
.fbar { display: grid; grid-template-columns: 116px 1fr; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.fbar .bar { height: 10px; background: var(--subtle); border-radius: 3px; position: relative; }
.fbar .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 0 3px 3px 0; }

/* ===== Vacíos ===== */
.empty { padding: 28px 8px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--fg); font-weight: 500; margin-bottom: 4px; }

/* ===== Datos nuevos ===== */
body.mark-new .nuevo { text-decoration: underline dotted var(--warn); text-underline-offset: 4px; text-decoration-thickness: 2px; }
body.mark-new .nuevo::after {
  content: "dato nuevo " attr(data-p); margin-left: 6px; font-size: 12px; font-weight: 500;
  color: var(--warn-ink); background: var(--warn-soft); padding: 0 6px; border-radius: 4px; text-decoration: none; display: inline-block;
}

.proto-foot { margin-top: 48px; font-size: 13px; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 16px; }

/* ===== Entrada única ===== */
.enter { opacity: 1; transform: none; transition: opacity 400ms var(--ease-out), transform 400ms var(--ease-out); }
@starting-style { .enter { opacity: 0; transform: translateY(10px); } }

/* ===== Layout por breakpoint ===== */
/* Escritorio ≥1280: gráficas 7/5 */
@media (min-width: 1280px) {
  .a-flujo { grid-column: span 7 !important; }
  .a-avance { grid-column: span 5 !important; }
  .a-aten, .a-comp { grid-column: span 6 !important; }
  .a-obras { order: 6; } .a-aten { order: 7; } .a-comp { order: 8; } .a-fiscal { order: 9; }
  .sup .a-avance, .sup .a-aten { grid-column: span 12 !important; }
}
/* Escritorio amplio ≥1440: obras 8 + atención 4, fiscal 7 + compromisos 5 */
@media (min-width: 1440px) {
  .a-obras { grid-column: span 8 !important; }
  .a-aten { grid-column: span 4 !important; }
  .a-fiscal { grid-column: span 7 !important; order: 8; }
  .a-comp { grid-column: span 5 !important; order: 9; }
  .sup .a-obras { grid-column: span 8 !important; }
  .sup .a-aten { grid-column: span 4 !important; }
}
/* Tablet */
@media (min-width: 768px) and (max-width: 1279px) {
  main { padding: 28px 24px 56px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 0; border-radius: 0 !important; }
  .kpi:nth-child(even) { border-left: 1px solid var(--border); }
  .kpi:nth-child(n+3) { border-top: 1px solid var(--border); }
  .kpi-value { font-size: 22px; line-height: 28px; }
  .a-aten, .a-comp { grid-column: span 6 !important; }
  .sup .a-aten { grid-column: span 12 !important; }
}
@media (max-width: 1023px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; top: 0; left: 0; bottom: 0; height: 100vh; width: 264px; z-index: 45;
    transform: translateX(-100%); transition: transform 300ms var(--ease-out); box-shadow: var(--shadow);
  }
  .app.drawer .side { transform: none; }
  .app.drawer .scrim { display: block; position: fixed; inset: 0; background: rgba(10,12,16,.4); z-index: 44; }
  .topbar {
    display: flex; align-items: center; gap: 12px; position: sticky; top: 45px; z-index: 30;
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px;
  }
  .topbar button { background: none; border: 0; padding: 6px; border-radius: 8px; cursor: pointer; display: grid; place-items: center; }
  .topbar b { font-weight: 600; }
  .topbar .avatar { margin-left: auto; }
}
/* Móvil */
@media (max-width: 767px) {
  main { padding: 20px 16px 48px; }
  .grid { gap: 24px; }
  .head h1 { font-size: 22px; line-height: 28px; }
  .controls { width: 100%; }
  .seg.periods { max-width: 100%; overflow-x: auto; }
  .seg button { padding: 6px 10px; white-space: nowrap; }
  .panel { padding: 16px; }
  .rail-d { display: none; }
  .rail-m { display: block; }
  .stepper { display: flex; align-items: center; gap: 0; margin: 4px 0 14px; }
  .stepper i { width: 12px; height: 12px; border-radius: 999px; background: var(--brand-track); flex: none; }
  .stepper i.done, .stepper i.cur { background: var(--brand-chart); }
  .stepper i.cur { box-shadow: 0 0 0 4px var(--brand-soft); }
  .stepper em { flex: 1; height: 3px; background: var(--brand-track); }
  .stepper em.done { background: var(--brand-chart); }
  .rail-m details { border-top: 1px solid var(--border); }
  .rail-m summary { padding: 12px 0; cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; list-style: none; }
  .rail-m summary::-webkit-details-marker { display: none; }
  .rail-m details[open] summary small { transform: rotate(180deg); }
  .rail-m .stage { padding: 0 0 12px; }
  .rail-m .stage.now { background: transparent; }
  .kpis { grid-template-columns: 1fr; }
  .kpi { border-left: 0 !important; border-top: 1px solid var(--border); border-radius: 0 !important; padding: 14px 16px;
         display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; }
  .kpi:first-child { border-top: 0; }
  .kpi > * { grid-column: 1 / -1; }
  .kpi .badge, .kpi .tag-priv { justify-self: start; }
  .kpi .kpi-label { grid-column: 1; }
  .kpi .kpi-value { grid-column: 2; grid-row: 1; font-size: 20px; line-height: 26px; text-align: right; }
  .rent { grid-template-columns: 1fr; }
  .fvals { grid-template-columns: 1fr; gap: 10px; }
  .fvals > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .fvals b { font-size: 17px; }
  .brow, .axis-x { grid-template-columns: 1fr 44px 72px; }
  .brow .gap { white-space: nowrap; }
  .brow .nm, .brow .inc { grid-column: 1 / -1; }
  .axis-x > :first-child { display: none; }
  .otable { display: none; }
  .ocards { display: grid; gap: 0; }
  .ocard { display: grid; gap: 6px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .ocard:last-child { border-bottom: 0; }
  .ocard-h { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .ocard-m { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .ocard-m b { color: var(--fg); font-weight: 500; }
  .a-aten { order: 2; } .a-kpi { order: 3; } .a-rent { order: 4; } .a-flujo { order: 5; } .a-avance { order: 6; }
  .a-obras { order: 7; } .a-comp { order: 8; } .a-fiscal { order: 9; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

function rail() {
  // Línea Lun(0)–Dom(7): Captura 0–3.5, Autorización 3.5–4.5, Pago 4.5–5, fin de semana 5–7. Hoy: jue por la tarde (3.7)
  const HOY = 3.7, segs = [[0, 3.5], [3.5, 4.5], [4.5, 5], [5, 7]];
  const line = segs.map(([a, b], i) => {
    const w = (b - a) / 7 * 100, f = Math.max(0, Math.min(1, (HOY - a) / (b - a))) * 100;
    const bg = i === 3 ? "var(--subtle)" : `linear-gradient(to right, var(--brand-chart) ${f}%, var(--brand-track) ${f}%)`;
    return `<i class="seg-line" style="width:calc(${w}% - 2px);background:${bg}"></i>`;
  }).join("");
  const days = ["Lun 5", "Mar 6", "Mié 7", "Jue 8", "Vie 9", "Sáb 10", "Dom 11"].map((d, i) =>
    `<span class="${i > 4 ? "wk" : ""} ${i === 3 ? "today" : ""}">${i === 3 ? "Hoy, jue 8" : d}</span>`).join("");

  let st;
  if (S.empty) {
    st = [["Captura", "Lun–jue", ["Sin gastos por revisar"]], ["Autorización", "Jue–vie", ["Sin movimientos pendientes"]], ["Pago", "Vie", ["Sin pagos pendientes"]]];
  } else if (isSup()) {
    const chips = OBRAS.filter(o => !o.incompleto).map(o => o.sup.ultimo === "Esta semana"
      ? `<span class="chip ok">${ic("check")}${o.nombre}</span>` : `<span class="chip pend">${ic("clock")}${o.nombre} · pendiente</span>`).join("");
    st = [
      ["Captura", "Lun–jue · cierra hoy", [`<a href="#">${nuevo("<b>4 de 5</b> obras con avance esta semana", "P5")}</a>`],
        `<div class="chips">${chips}</div><button class="btn-brand">${ic("pencil")}Capturar avance</button>`],
      ["Autorización", "Jue–vie", [`<a href="#">${nuevo("<b>2</b> de tus gastos en revisión", "P6")}</a>`]],
      ["Pago", "Vie", ["Lo gestiona administración"]],
    ];
  } else {
    st = [
      ["Captura", "Lun–jue", [`<a href="#"><b>4</b> gastos por revisar</a>`, `<a href="#">${nuevo("<b>4 de 5</b> obras con avance esta semana", "P5")}</a>`]],
      ["Autorización", "Jue–vie", [`<a href="#">${nuevo(`<b>12</b> movimientos por autorizar · <b>${money(184300)}</b>`, "P4")}</a>`, `<a href="#"><b>2</b> estimaciones listas para emitir</a>`]],
      ["Pago", "Vie", [`<a href="#">Obras <b class="num">${money(totPP)}</b></a>`, `<a href="#">Empresa <b class="num">${money(PP_EMPRESA)}</b></a>`]],
    ];
  }
  const NOW = 1;
  const stagesD = st.map(([n, d, items, extra], i) => `
    <div class="stage ${i === NOW ? "now" : ""}">
      <h3>${n} <small>${i === NOW ? "Etapa actual" : d}</small></h3>
      <ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>${extra || ""}
    </div>`).join("");
  const stepper = st.map((_, i) => `<i class="${i < NOW ? "done" : i === NOW ? "cur" : ""}"></i>`).join("<em class='done'></em>").replace(/<em class='done'><\/em>(<i class="")/, "<em></em>$1");
  const stagesM = st.map(([n, d, items, extra], i) => `
    <details ${i === NOW ? "open" : ""}><summary>${n} <small>${ic("chevd")}</small></summary>
      <div class="stage"><p class="muted" style="margin:0 0 6px;font-size:13px">${i === NOW ? "Etapa actual · " : ""}${d}</p>
      <ul>${items.map(x => `<li>${x}</li>`).join("")}</ul>${extra || ""}</div></details>`).join("");
  return `
  <section class="rail a-rail" aria-labelledby="rail-h">
    <div class="rail-top"><h2 id="rail-h">${isSup() ? "Tu semana de captura" : "La semana"}</h2>
      <small>Semana en curso · no cambia con el periodo · ${nuevo("días según el ciclo de Conkuali", "P8")}</small></div>
    <div class="rail-d">
      <div class="days">${days}</div>
      <div class="track">${line}<span class="today-dot" style="left:${HOY / 7 * 100}%" aria-hidden="true"></span></div>
      <div class="stages">${stagesD}</div>
    </div>
    <div class="rail-m">
      <div class="stepper" aria-hidden="true">${stepper}</div>
      <p style="margin:0 0 8px;font-weight:600">Hoy, jueves 8: ${st[NOW][0]}</p>
      ${stagesM}
    </div>
  </section>`;
}

        <span class="kpi-sub">${S.empty ? "" : "Falta Plaza Comercial Sur"}</span></a>

    </a>
    <a class="kpi" href="#"><span class="kpi-label">Por cobrar</span>
      <span class="kpi-value num">${S.empty ? "—" : money(POR_COBRAR[vista()])}</span>

    </a>
    <a class="kpi" href="#"><span class="kpi-label">Flujo neto · ${per.label}</span>
      <span class="kpi-value num ${S.empty ? "" : neto >= 0 ? "pos" : "neg"}">${S.empty ? "—" : signed(neto)}</span>
      ${S.empty ? `<span class="kpi-sub">Sin cobros ni pagos en este periodo</span>` : `

function flujoPanel() {
  if (isSup()) return "";
  const acum = S.periodo === "acumulado";
  let body;
  if (S.empty) body = `<div class="empty"><b>Sin cobros ni pagos registrados en este periodo.</b>Aquí verás entradas y pagos de obra por semana.</div>`;
  else if (S.tabla.flujo) {
    const rows = flowData();
    body = `<div style="overflow-x:auto"><table class="dtable num"><thead><tr><th>${acum ? "Mes" : "Semana"}</th><th class="r">Entradas</th><th class="r">Pagos de obra</th><th class="r">Neto</th></tr></thead>
      <tbody>${rows.map(r => `<tr><td>${r.title}</td><td class="r">${money(r.e)}</td><td class="r">${money(r.p)}</td><td class="r">${signed(r.e - r.p)}</td></tr>`).join("")}</tbody></table></div>`;
  } else body = `<div class="legend"><span><i class="sw" style="background:var(--brand-chart)"></i>Entradas</span><span><i class="sw" style="background:var(--series-2)"></i>Pagos de obra</span><span><i class="sw line"></i>Neto</span></div>
      <div class="chart" id="flow-chart"></div>`;
  return `<section class="panel a-flujo" aria-labelledby="flujo-h">
    <div class="panel-h"><div><h2 id="flujo-h">Flujo operativo</h2><p>Todo movimiento real, con o sin factura · ${acum ? "últimos 12 meses" : "últimas 10 semanas, " + PERIODOS[S.periodo].label + " resaltado"} · ${nuevo("serie histórica", "P7")}</p></div>
      ${S.empty ? "" : `<button class="linkbtn" data-act="tabla" data-v="flujo">${S.tabla.flujo ? "Ver como gráfica" : "Ver como tabla"}</button>`}</div>
    ${body}
  </section>`;
}
function flowData() {
  if (S.periodo === "acumulado") return MESES.map(m => ({ x: m.k, title: m.t, e: m.e, p: m.p, hi: true }));
  const w = PERIODOS[S.periodo].weeks;
  return SEM.map(x => ({ x: "S" + x.s, title: `Semana ${x.s} · ${weekRange(x.s)}${x.s === 41 ? " (en curso)" : ""}`, e: x.e, p: x.p, hi: w.includes(x.s) }));
}

function avancePanel() {
  const sup = isSup(), lbl = priv() ? "Costo pagado" : "Facturado";
  let body;
  if (S.empty) body = `<div class="empty"><b>Aún no hay obras activas.</b>Cuando registres una, aquí verás su avance.</div>`;
  else if (S.tabla.avance) {
    body = `<div style="overflow-x:auto"><table class="dtable num"><thead><tr><th>Obra</th><th class="r">Físico</th>${sup ? "" : `<th class="r">${lbl}</th><th class="r">Brecha</th>`}</tr></thead><tbody>
      ${obrasOrden().map(o => o.incompleto ? `<tr><td>${o.nombre}</td><td class="r" colspan="${sup ? 1 : 3}">Precios incompletos</td></tr>` :
        `<tr><td>${o.nombre}</td><td class="r">${pct(o.fis, 1)}</td>${sup ? "" : `<td class="r">${pct(priv() ? o.cp : o.fac, 1)}</td><td class="r">${fmtGap((priv() ? o.cp : o.fac) - o.fis)}</td>`}</tr>`).join("")}</tbody></table></div>`;
  } else {
    body = `${sup ? "" : `<div class="legend"><span><i class="sw" style="background:var(--brand-chart)"></i>Avance físico</span><span><i class="sw" style="width:2px;height:12px;background:var(--fg)"></i>${lbl}</span></div>`}
      <div class="bullets" role="list">${obrasOrden().map((o, i) => {
        if (o.incompleto) return `<div class="brow" role="listitem" tabindex="0"><span class="nm">${o.nombre}</span><span class="inc">${o.incompleto}</span></div>`;
        const fin = priv() ? o.cp : o.fac, gap = fin - o.fis, warn = !sup && Math.abs(gap) > 15;
        const tip = `<h4>${esc(o.nombre)}</h4><div class="tr"><span>Físico</span><b>${pct(o.fis, 1)}</b></div>` +
          (sup ? "" : `<div class="tr"><span>${lbl}</span><b>${pct(fin, 1)}</b></div><div class="tr"><span>Brecha</span><b>${fmtGap(gap, 1)}</b></div>`);
        return `<div class="brow" role="listitem" tabindex="0" data-tip="${esc(tip)}" aria-label="${esc(o.nombre)}: físico ${o.fis} %${sup ? "" : `, ${lbl.toLowerCase()} ${fin} %, brecha ${gap} pp`}">
          <span class="nm">${o.nombre}</span>
          <span class="btrack"><i class="f ${S.first ? "grow-x" : ""}" style="width:${o.fis}%;animation-delay:${i * 30}ms"></i>${sup ? "" : `<i class="m" style="left:${fin}%"></i>`}</span>
          <span class="pct num">${o.fis} %</span>
          <span class="gap num ${warn ? "warn" : ""}">${sup ? "" : (warn ? ic("triangle") : "") + fmtGap(gap)}</span>
        </div>`;
      }).join("")}</div>
      <div class="axis-x"><span></span><div><span>0 %</span><span>50 %</span><span>100 %</span></div><span></span><span></span></div>
      ${sup ? "" : `<p class="foot-note">Brecha = ${lbl.toLowerCase()} − avance físico. ${nuevo("Se resalta arriba de 15 pp", "P3")}.</p>`}`;
  }
  return `<section class="panel a-avance" aria-labelledby="av-h">
    <div class="panel-h"><div><h2 id="av-h">Avance de obras</h2><p>${sup ? "Avance físico por obra" : `Físico vs ${lbl.toLowerCase()} · a la fecha`}</p></div>
      ${S.empty ? "" : `<button class="linkbtn" data-act="tabla" data-v="avance">${S.tabla.avance ? "Ver como gráfica" : "Ver como tabla"}</button>`}</div>
    ${body}
  </section>`;
}
const fmtGap = (g, d = 0) => (g > 0 ? "+" : g < 0 ? "−" : "") + Math.abs(g).toFixed(d) + " pp";

function pill(key) { const s = SALUD[key]; return `<span class="badge ${s.c}">${ic(s.ic)}${s.t}</span>`; }

function obrasPanel() {
  const sup = isSup(), p = priv();

  const total = groups ? groups.reduce((a, g) => a + g[2].length, 0) : 0;

  return `<section class="panel a-aten" aria-labelledby="at-h">

      ${total > LIM ? `<button class="linkbtn" data-act="todas" aria-expanded="${S.verTodas}">${S.verTodas ? "Ver menos" : `Ver las ${total}`}</button>` : ""}</div>
    ${body}
  </section>`;
}

function compromisosPanel() {
  if (isSup()) return "";
  const items = [
    ["wallet", "Pago pendiente · Torre Norte", "Hace 4 días", 412800], ["wallet", "Pago pendiente · Nave Apodaca", "Hace 3 días", 343300],
    ["wallet", "Pago pendiente · Bodega Industrial B2", "Hace 16 días", 286000], ["wallet", "Pago pendiente · Plaza Comercial Sur", "Hace 2 días", 198400],
    ["receipt", "Reposición R-0142", "J. Ejemplo", 18450], ["repeat", "Renta de andamios", "Gasto recurrente", null],
  ];
  return `<section class="panel a-comp" aria-labelledby="co-h">
    <div class="panel-h"><div><h2 id="co-h">Próximos compromisos</h2><p>Ordenados por monto</p></div></div>
    ${S.empty ? `<div class="empty"><b>Sin pagos ni reposiciones pendientes.</b></div>` :
    `<ul class="clist">${items.map(([i, t, d, m]) => `<li><span class="cic">${ic(i)}</span><span><b>${t}</b><small>${d}</small></span>
      <span class="num amt" style="text-align:right">${m == null ? `<span class="muted" style="font-weight:400">Monto por capturar</span>` : money(m)}</span></li>`).join("")}</ul>`}
  </section>`;
}

function fiscalSec() {
  if (isSup()) return "";
  const [ing, egr] = S.empty ? [0, 0] : FISCAL[S.periodo], res = ing - egr, max = Math.max(ing, egr) || 1;
  return `<section class="fiscal a-fiscal" aria-labelledby="fi-h">
    <div class="sec-h"><div><h2 id="fi-h">Fiscal · ${PERIODOS[S.periodo].label}</h2><p>Contabilidad: solo lo marcado con factura. Es distinto del flujo operativo.</p></div>
      <a class="linkbtn" href="#">Abrir Contabilidad</a></div>
    <div class="fvals">
      <div><small>Ingresos fiscales</small><b class="num">${S.empty ? "—" : money(ing)}</b></div>
      <div><small>Egresos fiscales</small><b class="num">${S.empty ? "—" : money(egr)}</b></div>
      <div><small>Resultado</small><b class="num">${S.empty ? "—" : signed(res)}</b></div>
    </div>
    ${S.empty ? "" : `<div class="fbars" role="img" aria-label="Ingresos ${money(ing)} frente a egresos ${money(egr)}">
      <div class="fbar"><span>Ingresos</span><span class="bar"><i style="width:${ing / max * 100}%;background:var(--fg);opacity:.75"></i></span></div>
      <div class="fbar"><span>Egresos</span><span class="bar"><i style="width:${egr / max * 100}%;background:var(--series-2)"></i></span></div>
    </div>`}
  </section>`;
}

/* ======================= Gráfica de flujo (SVG) ======================= */
let flowIdx = -1;
function drawFlow() {
  const el = document.getElementById("flow-chart");
  if (!el) return;
  let data = flowData();
  const W = el.clientWidth;
  if (W < 480 && S.periodo !== "acumulado") data = data.slice(-6);
  const H = W < 480 ? 200 : 240, m = { l: 52, r: 8, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const nets = data.map(d => d.e - d.p);
  const hi = Math.max(...data.map(d => Math.max(d.e, d.p)));
  const lo = Math.min(0, ...nets);
  const step = niceStep((hi - lo) / 4);
  const yMax = Math.ceil(hi / step) * step, yMin = Math.floor(lo / step) * step;
  const y = v => m.t + (yMax - v) / (yMax - yMin) * ih;
  const bw = iw / data.length, w = Math.max(4, Math.min(18, (bw - 14) / 2));
  const cx = i => m.l + bw * i + bw / 2;
  const bar = (x, v, cls, fill, op, i) => {
    if (v <= 0) return "";
    const y0 = y(0), y1 = y(v), h = y0 - y1, r = Math.min(3, h);
    return `<path class="b" d="M${x},${y0}V${y1 + r}q0,-${r} ${r},-${r}h${w - 2 * r}q${r},0 ${r},${r}V${y0}z" style="fill:${fill};opacity:${op};animation-delay:${i * 30}ms"/>`;
  };
  let g = "";
  for (let v = yMin; v <= yMax + 1; v += step) {
    g += `<line class="${v === 0 ? "zero" : "grid-l"}" x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}"/>`;
    g += `<text x="${m.l - 8}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`;
  }
  data.forEach((d, i) => {
    const op = d.hi ? 1 : .4;
    g += bar(cx(i) - w - 1, d.e, "e", "var(--brand-chart)", op, i);
    g += bar(cx(i) + 1, d.p, "p", "var(--series-2)", op, i);
    if (W >= 400 || i % 2 === (data.length - 1) % 2) g += `<text x="${cx(i)}" y="${H - 6}" text-anchor="middle" style="${d.hi && S.periodo !== "acumulado" ? "fill:var(--fg);font-weight:500" : ""}">${d.x}</text>`;
  });
  const pts = data.map((d, i) => `${cx(i)},${y(d.e - d.p)}`).join(" ");
  g += `<polyline points="${pts}" style="fill:none;stroke:var(--fg);stroke-width:2;stroke-linejoin:round;opacity:.85"/>`;
  data.forEach((d, i) => { g += `<circle cx="${cx(i)}" cy="${y(d.e - d.p)}" r="4" style="fill:var(--fg);stroke:var(--surface);stroke-width:2;opacity:${d.hi ? 1 : .55}"/>`; });
  g += `<line class="xhair" id="xhair" y1="${m.t}" y2="${m.t + ih}" x1="-10" x2="-10" style="opacity:0"/>`;
  data.forEach((d, i) => { g += `<rect x="${m.l + bw * i}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent" data-i="${i}"/>`; });
  const label = `Gráfica de flujo operativo con ${data.length} ${S.periodo === "acumulado" ? "meses" : "semanas"}. Usa las flechas para recorrer los valores.`;
  el.innerHTML = `<svg width="${W}" height="${H}" tabindex="0" role="img" aria-label="${label}" class="${S.first ? "bars-grow" : ""}">${g}</svg>`;
  const svg = el.firstChild;
  const show = (i, anchorEl) => {
    flowIdx = i; const d = data[i], xh = svg.querySelector("#xhair");
    xh.setAttribute("x1", cx(i)); xh.setAttribute("x2", cx(i)); xh.style.opacity = 1;
    const r = svg.getBoundingClientRect();
    showTip(`<h4>${d.title}</h4>
      <div class="tr"><span><i class="sw" style="background:var(--brand-chart)"></i>Entradas</span><b>${money(d.e)}</b></div>
      <div class="tr"><span><i class="sw" style="background:var(--series-2)"></i>Pagos de obra</span><b>${money(d.p)}</b></div>
      <div class="tr"><span><i class="sw line"></i>Neto</span><b>${signed(d.e - d.p)}</b></div>
      ${d.e === 0 ? `<div class="muted" style="margin-top:4px">Sin cobros esta semana</div>` : ""}`, r.left + cx(i), r.top + y(Math.max(d.e, d.p)));
  };
  const hide = () => { svg.querySelector("#xhair").style.opacity = 0; hideTip(); };
  svg.addEventListener("mousemove", e => { const t = e.target.closest("rect[data-i]"); if (t) show(+t.dataset.i); });
  svg.addEventListener("mouseleave", hide);
  svg.addEventListener("focus", () => show(flowIdx >= 0 && flowIdx < data.length ? flowIdx : data.length - 1));
  svg.addEventListener("blur", hide);
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { e.preventDefault(); show(Math.min(data.length - 1, flowIdx + 1)); }
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { e.preventDefault(); show(Math.max(0, flowIdx - 1)); }
    if (e.key === "Escape") hide();
  });
}
function niceStep(raw) {
  const p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
}

/* ======================= Tooltip ======================= */
const tipEl = document.getElementById("tip");
function showTip(html, x, y) {
  tipEl.innerHTML = html; tipEl.classList.add("on");
  const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)), top = y - h - 12;
  if (top < 52) top = y + 16;
  tipEl.style.left = left + "px"; tipEl.style.top = top + "px";
}
function hideTip() { tipEl.classList.remove("on"); }
function bindBulletTips() {
  document.querySelectorAll(".brow[data-tip]").forEach(r => {
    const on = () => { const b = r.getBoundingClientRect(); showTip(r.dataset.tip, b.left + b.width * .55, b.top); };
    r.addEventListener("mouseenter", on); r.addEventListener("focus", on);
    r.addEventListener("mouseleave", hideTip); r.addEventListener("blur", hideTip);
  });
}

/* ======================= Render principal ======================= */
function render() {
  hideTip();
  renderProto(); renderShell();
  document.body.classList.toggle("mark-new", S.markNew);
  const root = document.getElementById("root");
  root.innerHTML = header() + `<div class="grid ${isSup() ? "sup" : ""}">${rail()}${kpis()}${rentabilidad()}${flujoPanel()}${avancePanel()}${obrasPanel()}${atencionPanel()}${fiscalSec()}${compromisosPanel()}</div>
    <p class="proto-foot">Prototipo con datos ficticios para revisión de diseño. Los elementos marcados como “dato nuevo” requieren información que hoy no calcula Arqento y deben validarse con el equipo (P2–P8). El modo oscuro y el menú móvil son propuestas (P16, P17).</p>`;
  drawFlow(); bindBulletTips();
  S.first = false;
}
function applyBrand() { document.getElementById("app").style.setProperty("--brand", S.brand); }
function applyTheme() {
  if (S.theme === "system") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", S.theme);
}

/* ======================= Eventos ======================= */
document.addEventListener("click", e => {
  const a = e.target.closest("a[href='#']"); if (a) e.preventDefault();
  const t = e.target.closest("[data-act]"); if (!t) return;
  const v = t.dataset.v;
  switch (t.dataset.act) {
    case "rol": S.rol = v; break;
    case "vista": S.vista = v; break;
    case "periodo": S.periodo = v; break;
    case "tabla": S.tabla[v] = !S.tabla[v]; break;
    case "todas": S.verTodas = !S.verTodas; break;
    case "brand": S.brand = v; applyBrand(); renderProto(); return;
    case "theme": S.theme = v; applyTheme(); renderProto(); drawFlow(); return;
    case "drawer": document.getElementById("app").classList.toggle("drawer"); return;
    default: return;
  }
  render();
});
document.getElementById("pc-priv").addEventListener("click", () => { S.privDisp = !S.privDisp; render(); });
document.getElementById("pc-empty").addEventListener("click", () => { S.empty = !S.empty; render(); });
document.getElementById("pc-new").addEventListener("click", () => { S.markNew = !S.markNew; renderProto(); document.body.classList.toggle("mark-new", S.markNew); });
document.addEventListener("input", e => { if (e.target.id === "pc-color") { S.brand = e.target.value; applyBrand(); } });
document.addEventListener("change", e => { if (e.target.id === "pc-color") renderProto(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("app").classList.remove("drawer"); });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawFlow, 120); });

// Estado inicial opcional por URL, p. ej. index.html#rol=SUPERVISOR&vista=privado&periodo=mes&theme=light&brand=f2b705
try {
  const q = new URLSearchParams(location.hash.slice(1));
  if (PERSONAS[q.get("rol")]) S.rol = q.get("rol");
  if (["general", "privado"].includes(q.get("vista"))) S.vista = q.get("vista");
  if (PERIODOS[q.get("periodo")]) S.periodo = q.get("periodo");
  if (["system", "light", "dark"].includes(q.get("theme"))) S.theme = q.get("theme");
  if (/^[0-9a-f]{6}$/i.test(q.get("brand") || "")) S.brand = "#" + q.get("brand");
  if (q.get("vacio") === "1") S.empty = true;
} catch (e) {}
applyBrand(); applyTheme(); render();
</script>
